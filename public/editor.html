<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zando Design Editor V22 — Design final — Badges et vidéo fonctionnels</title>
<style>
:root{
 --bg:#f5f6fb;--panel:#fff;--panel2:#fafaff;--line:#e7e8f0;--text:#15172a;--muted:#73778d;
 --accent:#7557f7;--accent2:#9b82ff;--danger:#ef545d;--shadow:0 18px 55px rgba(31,34,68,.12)
}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
button,input,textarea,select{font:inherit}button{cursor:pointer}.app{height:100%;display:flex;flex-direction:column}
.topbar{height:76px;flex:0 0 76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 18px;z-index:50}
.brand{display:flex;align-items:center;gap:14px;min-width:330px}.logo{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#4a64ff,#9b3ee7);color:#fff;font-size:23px;font-weight:900;box-shadow:0 10px 28px rgba(117,87,247,.28)}
.brand-title{font-size:18px;font-weight:800}.brand-sub{font-size:11px;color:var(--muted);margin-top:3px}.grow{flex:1}
.icon-btn,.text-btn{border:1px solid var(--line);background:#fff;color:#3d4155;border-radius:11px;transition:.17s}.icon-btn{width:42px;height:42px;display:grid;place-items:center}.icon-btn:hover,.icon-btn.active{border-color:#d5ccff;background:#f2eeff;color:var(--accent)}
.text-btn{padding:11px 18px;font-size:12px;font-weight:700}.text-btn.primary{background:linear-gradient(135deg,#7657f7,#8b55ee);color:#fff;border-color:transparent;box-shadow:0 9px 22px rgba(117,87,247,.25)}
.device-group{display:flex;gap:5px;padding:4px;border-radius:12px;background:#f5f3ff}.device-group .icon-btn{border:0;background:transparent}.device-group .icon-btn.active{background:#e8e1ff}
.main{flex:1;min-height:0;display:grid;grid-template-columns:80px 255px minmax(560px,1fr) 320px}
.rail{background:#fff;border-right:1px solid var(--line);padding:14px 8px;display:flex;flex-direction:column;gap:12px}
.rail-btn{border:0;background:transparent;border-radius:12px;min-height:66px;padding:8px 4px;color:#4f5368;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:10px}
.rail-btn .ico{font-size:22px}.rail-btn:hover,.rail-btn.active{background:#f1edff;color:var(--accent)}
.side{background:#fff;border-right:1px solid var(--line);min-height:0;overflow:auto}.side-head{height:54px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 16px;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.side-body{padding:14px}.tool-list{display:grid;gap:8px}.tool{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px;display:flex;gap:10px;align-items:center;text-align:left;color:var(--text)}
.tool:hover{border-color:#cabfff;box-shadow:0 6px 18px rgba(117,87,247,.08)}.tool-icon{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:#f5f4fb;font-size:19px;font-weight:800}
.tool-title{font-size:12px;font-weight:750}.tool-desc{font-size:10px;color:var(--muted);margin-top:2px}.section-title{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:20px 0 10px}
.library{display:grid;grid-template-columns:1fr 1fr;gap:10px}.lib-card{border:0;background:transparent;padding:0;text-align:left}.lib-thumb{height:64px;border-radius:9px;background:linear-gradient(135deg,#fee0c5,#8357f7);border:1px solid var(--line);overflow:hidden;display:grid;place-items:center;font-size:22px}.lib-name{font-size:10px;text-align:center;color:#5e6278;margin-top:5px}
.workspace{min-width:0;min-height:0;overflow:auto;padding:14px 16px 22px;background:#f7f7fb}.workspace-card{min-width:820px}.preview-head{height:46px;background:#fff;border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:12px;font-weight:750}
.size-pill{font-size:10px;color:var(--muted);padding:6px 9px;border-radius:7px;background:#f6f6fa}
.stage{background:#fff;border:1px solid var(--line);padding:0 14px 14px}.canvas-wrap{display:flex;justify-content:center;overflow:auto;padding-top:0}
.canvas-shell{position:relative;flex:0 0 auto}.canvas{position:relative;width:1280px;height:384px;overflow:hidden;border-radius:13px;background:
radial-gradient(circle at 86% 23%,rgba(255,105,190,.78),transparent 23%),
radial-gradient(circle at 74% 24%,rgba(116,72,242,.66),transparent 31%),
linear-gradient(135deg,#101657,#211569 52%,#9f368f);box-shadow:var(--shadow);transform-origin:top left}
.item{position:absolute;user-select:none;touch-action:none;cursor:move}.item.hidden{display:none}.item.locked{cursor:not-allowed}.item.selected{outline:2px solid #3787ff;outline-offset:2px}
.item-text{width:100%;height:100%;white-space:pre-wrap;word-break:break-word;overflow:hidden}.item-button{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}.item-image{width:100%;height:100%;display:grid;place-items:center;overflow:hidden}.item-image img{width:100%;height:100%;object-fit:cover}
.handle{position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid #3787ff;z-index:40}.nw{left:-7px;top:-7px;cursor:nwse-resize}.n{left:50%;top:-7px;transform:translateX(-50%);cursor:ns-resize}.ne{right:-7px;top:-7px;cursor:nesw-resize}.e{right:-7px;top:50%;transform:translateY(-50%);cursor:ew-resize}.se{right:-7px;bottom:-7px;cursor:nwse-resize}.s{left:50%;bottom:-7px;transform:translateX(-50%);cursor:ns-resize}.sw{left:-7px;bottom:-7px;cursor:nesw-resize}.w{left:-7px;top:50%;transform:translateY(-50%);cursor:ew-resize}
.selection-bar{position:absolute;top:-44px;left:50%;transform:translateX(-50%);display:flex;gap:4px;background:#fff;border:1px solid var(--line);padding:5px;border-radius:10px;box-shadow:0 10px 28px rgba(30,32,55,.18);z-index:60}.selection-bar button{border:0;background:transparent;width:30px;height:28px;border-radius:7px;color:#555a70;display:grid;place-items:center}.selection-bar button:hover{background:#f1edff;color:var(--accent)}.selection-bar button[data-act="delete"]:hover{background:#fff0f1;color:var(--danger)}
.type-tag{position:absolute;left:0;top:-38px;padding:7px 10px;border-radius:7px;color:#fff;background:var(--accent);font-size:10px;font-weight:750;z-index:65}.tag-image{background:#ff864b}.tag-button{background:#eb5c83}.tag-shape{background:#34a878}
.add-section{display:flex;justify-content:center;padding:16px}.add-section button{border:1px solid #bbaeff;color:var(--accent);background:#fff;border-radius:9px;padding:10px 18px;font-size:11px;font-weight:700}
.bottom{background:#fff;border:1px solid var(--line);border-radius:12px;min-height:155px;display:grid;grid-template-columns:1fr auto auto;gap:16px;padding:14px;margin-top:2px}.bottom-title{font-size:10px;font-weight:800;margin-bottom:8px}.layers-list{max-height:110px;overflow:auto}.layer-row{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:6px;font-size:10px;color:#5d6175;cursor:pointer}.layer-row:hover,.layer-row.active{background:#eee9ff;color:#3d2a9f}.layer-name{flex:1}.layer-row button{border:0;background:transparent;color:#7c8094;padding:2px 4px}
.depth{align-self:center;display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}.depth button{border:0;background:#fff;padding:11px 16px;font-size:10px;color:#5e6277}.depth button.active{background:#eee9ff;color:var(--accent);font-weight:750}
.actions{align-self:center;display:flex;gap:8px}.actions button{border:1px solid var(--line);background:#fff;padding:10px 14px;border-radius:8px;font-size:10px}.actions .delete{color:var(--danger)}
.right{background:#fff;border-left:1px solid var(--line);min-height:0;overflow:auto}.right-head{height:54px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--line);font-size:12px;font-weight:800}.tabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}.tab{border:0;background:#fff;padding:16px 6px;font-size:10px;color:#666b80;border-bottom:2px solid transparent}.tab.active{color:var(--accent);border-bottom-color:var(--accent)}.props{padding:14px}
.prop-section{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:14px}.prop-title{font-size:10px;font-weight:850;letter-spacing:.04em;text-transform:uppercase;margin-bottom:12px}.field{margin-bottom:11px}.field label{font-size:10px;color:#62667a;display:block;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 10px;font-size:10px;outline:none;color:#25283b}.field textarea{min-height:70px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#a994ff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.mini-label{font-size:8px;text-align:center;color:#878b9d;margin-top:4px}
.slider-row{display:grid;grid-template-columns:1fr 70px;gap:8px;align-items:center}.align-row{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.align-row button{flex:1;border:0;background:#fff;padding:9px}.align-row button.active{background:#eee9ff;color:var(--accent)}
.color-row{display:flex;gap:8px}.color-swatch{width:34px;border:1px solid var(--line);border-radius:8px;padding:0}.empty{font-size:11px;color:var(--muted);line-height:1.55;background:#fafaff;border:1px solid var(--line);padding:12px;border-radius:9px}
.template-grid{display:grid;gap:10px}.template{border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff}.template-preview{height:90px;border-radius:7px;background:linear-gradient(135deg,#101657,#b245a0);position:relative;overflow:hidden}.template-preview:before{content:"";position:absolute;left:10px;top:22px;width:45%;height:8px;background:#fff;border-radius:3px;box-shadow:0 14px 0 rgba(255,255,255,.7),0 28px 0 rgba(255,255,255,.25)}.template-name{font-size:10px;font-weight:700;margin-top:7px}
.option{border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:8px;font-size:10px;background:#fff}.switch{display:flex;align-items:center;justify-content:space-between}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1b1d2c;color:#fff;padding:10px 14px;border-radius:999px;font-size:11px;opacity:0;pointer-events:none;transition:.2s;z-index:100}.toast.show{opacity:1}
@media(max-width:1180px){.main{grid-template-columns:70px 230px minmax(560px,1fr)}.right{display:none}.brand{min-width:260px}}
</style>

<style>
.canvas-shell{transition:width .18s,height .18s}
.guide{position:absolute;z-index:999;pointer-events:none;background:#ff3fb4;display:none}
.guide.v{width:1px;top:0;bottom:0}.guide.h{height:1px;left:0;right:0}
.distance-label{position:absolute;z-index:1000;background:#ff3fb4;color:#fff;border-radius:5px;padding:3px 6px;font-size:9px;display:none;pointer-events:none}
.preview-overlay{position:fixed;inset:0;background:#10111a;z-index:5000;display:none;align-items:center;justify-content:center;padding:30px}
.preview-overlay.open{display:flex}.preview-frame{position:relative;max-width:96vw;max-height:92vh;overflow:auto}
.preview-close{position:fixed;right:24px;top:20px;border:0;background:#fff;color:#111;border-radius:10px;padding:11px 15px;font-weight:800;z-index:5001}
.layer-row[draggable="true"]{cursor:grab}.layer-row.dragging{opacity:.4}.layer-row.drop-target{outline:2px solid #7557f7}
.layer-name[contenteditable="true"]{outline:1px solid #a994ff;background:#fff;padding:2px 4px;border-radius:4px}
.layer-order{display:flex;gap:2px}.layer-order button{font-size:9px}
.prop-help{font-size:9px;color:#8a8ea0;margin-top:5px;line-height:1.4}
.check-row{display:flex;gap:12px;align-items:center;font-size:10px;color:#62667a;margin-top:8px}
.fullscreen-workspace .rail,.fullscreen-workspace .side,.fullscreen-workspace .right,.fullscreen-workspace .bottom,.fullscreen-workspace .add-section{display:none!important}
.fullscreen-workspace .main{grid-template-columns:1fr!important}.fullscreen-workspace .workspace{padding:20px}.fullscreen-workspace .workspace-card{min-width:0}
</style>


<style>
.bg-mode-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.bg-mode-tabs button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 5px;font-size:9px;color:#5e6277}
.bg-mode-tabs button.active{background:#eee9ff;border-color:#b6a8ff;color:#7557f7;font-weight:800}
.gradient-preview{height:74px;border-radius:10px;border:1px solid var(--line);margin-bottom:10px}
.color-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.color-box{border:1px solid var(--line);border-radius:9px;padding:8px;background:#fff}
.color-box input[type=color]{width:100%;height:34px;border:0;background:transparent;padding:0}
.bg-upload-drop{border:1px dashed #b8aaff;background:#faf8ff;border-radius:10px;padding:16px;text-align:center;font-size:10px;color:#6d5fc7}
.bg-thumb-preview{height:110px;border-radius:10px;background:#f0f1f5 center/cover no-repeat;border:1px solid var(--line);margin-bottom:10px}
</style>


<style>
.custom-picker{margin-top:8px}
.picker-sv{
  position:relative;height:150px;border-radius:10px;cursor:crosshair;overflow:hidden;
  background:
    linear-gradient(to top,#000,transparent),
    linear-gradient(to right,#fff,transparent);
  border:1px solid var(--line);
  touch-action:none;
}
.picker-sv::before{
  content:"";position:absolute;inset:0;background:hsl(var(--picker-hue,270),100%,50%);
  z-index:-1;
}
.picker-cursor{
  position:absolute;width:14px;height:14px;border:2px solid #fff;border-radius:50%;
  box-shadow:0 0 0 1px rgba(0,0,0,.5);transform:translate(-50%,-50%);
  pointer-events:none;
}
.picker-hue{
  width:100%;height:14px;border-radius:999px;margin-top:10px;cursor:pointer;appearance:none;
  background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);
}
.picker-hue::-webkit-slider-thumb{
  appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid #333;
}
.picker-hue::-moz-range-thumb{
  width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid #333;
}
.picker-values{display:grid;grid-template-columns:1fr 72px;gap:8px;margin-top:8px}
.picker-values input{width:100%}
</style>


<style>
input[type="range"], .picker-sv, .picker-hue{
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}
input[type="range"]{pointer-events:auto!important}
</style>


<style>
.template{cursor:pointer;text-align:left;transition:.16s transform,.16s border-color,.16s box-shadow}
.template:hover{transform:translateY(-2px);border-color:#9e8cff;box-shadow:0 8px 22px rgba(80,59,180,.12)}
.template-preview{position:relative}
.template-preview.centered:before{left:22%;top:18px;width:56%;height:8px;box-shadow:0 14px 0 rgba(255,255,255,.72),0 33px 0 rgba(255,255,255,.28)}
.template-preview.centered:after{content:"";position:absolute;left:34%;bottom:12px;width:32%;height:13px;border-radius:4px;background:#ff7187}
.template-preview.product{background:linear-gradient(135deg,#f5eee7,#d6b49a)}
.template-preview.product:before{left:9px;top:19px;width:41%;background:#342b28;box-shadow:0 14px 0 rgba(52,43,40,.55),0 34px 0 #7f5cff}
.template-preview.product:after{content:"";position:absolute;right:12px;top:10px;width:38%;height:70px;border-radius:10px;background:linear-gradient(145deg,#f6b47e,#653b82)}
.template-preview.promo{background:linear-gradient(135deg,#ff835e,#7c42dc)}
.template-preview.promo:after{content:"-40%";position:absolute;right:12px;top:15px;width:46px;height:46px;border-radius:50%;background:#fff;color:#7c42dc;display:grid;place-items:center;font-size:11px;font-weight:900}
.template-meta{font-size:8px;color:#8b8fa0;margin-top:3px}
</style>


<style>
.badge-editor-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.badge-preview-box{padding:14px;border:1px solid var(--line);border-radius:10px;background:#fafafa;margin-bottom:10px}
</style>


<style>
.badge-box{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:12px 16px;box-sizing:border-box;cursor:move}
.badge-content{width:100%;pointer-events:none}
.badge-main,.badge-sub{pointer-events:none}
.nudge-grid{display:grid;grid-template-columns:repeat(3,42px);justify-content:center;gap:5px;margin-top:8px}
.nudge-grid button{height:36px;border:1px solid var(--line);background:#fff;border-radius:8px;font-weight:800}
.nudge-grid button:hover{background:#eee9ff;color:var(--accent)}
.video-shell{width:100%;height:100%;position:relative;overflow:hidden;background:#171a32;display:grid;place-items:center}
.video-shell video{width:100%;height:100%;display:block}
.video-empty{color:#fff;text-align:center;font-size:30px;pointer-events:none}
.video-empty small{display:block;font-size:10px;margin-top:7px;opacity:.72}
.video-status{font-size:9px;color:#7c8095;margin-top:6px;line-height:1.45}
</style>


<style>
.badge-box{position:relative;overflow:hidden}
.badge-main,.badge-sub{position:absolute;display:block;cursor:grab;user-select:none;touch-action:none;white-space:nowrap}
.badge-main.dragging,.badge-sub.dragging{cursor:grabbing}
.badge-library{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.badge-card{border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px;cursor:pointer;text-align:center}
.badge-card:hover{border-color:#8d79ff;background:#faf8ff}
.badge-card .sample{min-height:48px;display:grid;place-items:center}
.badge-card small{display:block;color:#8a8ea0;font-size:8px;margin-top:6px}
.group-toolbar{display:flex;gap:6px;padding:6px;border:1px solid var(--line);border-radius:10px;background:#fff}
.group-toolbar button{border:0;background:#f6f4ff;border-radius:7px;padding:8px 10px;font-size:10px;cursor:pointer}
.group-toolbar button:hover{background:#e9e3ff}
.item.multi-selected{outline:2px dashed #ff4ab8!important;outline-offset:2px}
.group-tag{position:absolute;right:6px;bottom:6px;background:#171827;color:#fff;border-radius:5px;padding:3px 6px;font-size:8px;pointer-events:none}
.badge-part-controls{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.badge-part-controls .field{margin:0}
</style>


<style>
.group-edit-frame{
  position:absolute;border:2px solid #ff3fb4;border-radius:8px;pointer-events:none;z-index:1200;
}
.group-edit-label{
  position:absolute;left:0;top:-25px;background:#ff3fb4;color:#fff;
  border-radius:6px;padding:4px 8px;font-size:9px;font-weight:800;white-space:nowrap;
}
.group-edit-bar{
  display:none;align-items:center;gap:8px;padding:6px 10px;border-radius:10px;
  background:#fff1fa;border:1px solid #ff9bd5;color:#a51d70;font-size:10px;font-weight:700;
}
.group-edit-bar.active{display:flex}
.group-edit-bar button{
  border:0;background:#ff3fb4;color:#fff;border-radius:7px;padding:6px 9px;cursor:pointer;font-size:9px
}
.item.group-member-selected{outline:2px solid #ff3fb4!important;outline-offset:2px}
.item.group-locked-selection{outline:none!important}
</style>


<style>
.inspector-section{border-bottom:1px solid var(--line);padding:12px}
.inspector-section:last-child{border-bottom:0}
.inspector-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.inspector-head strong{font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.inspector-toggle{width:32px;height:18px;accent-color:#7557f7}
.segmented{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#f1eff7;padding:3px;border-radius:8px}

.segmented button.active{background:#fff;box-shadow:0 1px 5px rgba(32,24,70,.12)}
.stroke-preview{height:38px;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;background:#fafafa;margin-bottom:9px}
.stroke-preview span{display:block;width:78%;border-top:3px solid #7557f7}
.corner-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.property-note{font-size:8px;line-height:1.5;color:#85899a}
.fx-row{display:grid;grid-template-columns:1fr 74px;gap:7px}
.shape-node{width:100%;height:100%;box-sizing:border-box}
.check-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0}
</style>


<style>
.font-row{display:grid;grid-template-columns:1.4fr .8fr;gap:8px}
.align-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.align-grid button{border:1px solid var(--line);background:#fff;padding:7px;border-radius:7px;cursor:pointer}
.align-grid button.active{background:#7557f7;color:#fff;border-color:#7557f7}
.range-pair{display:grid;grid-template-columns:1fr 58px;gap:8px;align-items:center}
.range-pair input[type=number]{width:100%}

// ── Protocole ZANDO_EDITOR_READY → ZANDO_EDITOR_LOAD → ZANDO_EDITOR_LOADED ──
// Ce listener est installé AVANT toute initialisation pour ne jamais manquer un LOAD.
const _ZANDO_PARENT_ORIGIN=(function(){try{return window.parent!==window?window.location.origin:null;}catch(e){return null;}})();
let _externalLoaded=false,_editorReady=false,_pendingState=null;

function _applyExternalState(payload){
  try{
    // Notre classicToV22 renvoie {background,backgroundConfig,elements,settings}
    let projectState=null;
    if(payload&&typeof payload==='object'){
      if(Array.isArray(payload.elements)){
        projectState=JSON.parse(JSON.stringify(payload));
      }else if(payload.project&&Array.isArray(payload.project.elements)){
        projectState=JSON.parse(JSON.stringify(payload.project));
      }else if(Array.isArray(payload.pages)&&payload.pages.length>0){
        const pid=payload.activePageId||payload.pages[0].id;
        const pg=payload.pages.find(p=>p.id===pid)||payload.pages[0];
        if(typeof zandoPages!=='undefined'){
          zandoPages=JSON.parse(JSON.stringify(payload.pages));
          activePageId=pid;
        }
        projectState=JSON.parse(JSON.stringify(pg.state));
      }
    }
    if(!projectState)throw new Error('Format non reconnu');

    _externalLoaded=true;
    history=[];future=[];selected=null;
    if(typeof selectedIds!=='undefined')selectedIds=[];

    state=projectState;
    if(typeof ensureBackgroundConfig==='function')ensureBackgroundConfig();

    // Réinitialise toujours zandoPages avec le nouvel état
    // (la condition length===0 était fausse : savedProjectV20 peuplait déjà zandoPages)
    if(typeof zandoPages!=='undefined'){
      const pid2='page-'+Date.now();
      zandoPages=[{id:pid2,name:'Slide 1',state:JSON.parse(JSON.stringify(projectState))}];
      if(typeof activePageId!=='undefined')activePageId=pid2;
    }

    if(typeof renderSide==='function')renderSide();
    render();
    if(typeof renderPageStrip==='function')renderPageStrip();
    if(typeof fitCanvasV22==='function')requestAnimationFrame(()=>fitCanvasV22());
    toast('✅ Projet chargé');

    if(_ZANDO_PARENT_ORIGIN){
      window.parent.postMessage({type:'ZANDO_EDITOR_LOADED'},_ZANDO_PARENT_ORIGIN);
    }
  }catch(err){
    console.error('[Zando Editor] Erreur chargement état externe',err);
    if(_ZANDO_PARENT_ORIGIN){
      window.parent.postMessage({type:'ZANDO_EDITOR_LOAD_ERROR',message:String(err)},_ZANDO_PARENT_ORIGIN);
    }
  }
}

window.addEventListener('message',function(ev){
  if(_ZANDO_PARENT_ORIGIN&&ev.origin!==_ZANDO_PARENT_ORIGIN)return;
  if(!ev.data||typeof ev.data!=='object')return;
  if(ev.data.type==='ZANDO_EDITOR_LOAD'&&ev.data.state){
    if(!_editorReady||typeof render!=='function'){
      _pendingState=ev.data.state;
      return;
    }
    _applyExternalState(ev.data.state);
  }
});

let zoomLevel=1, clipboardElement=null, autoSaveTimer=null, draggedLayerId=null;


function hexToHsv(hex){
  const h=(hex||'#000000').replace('#','');
  const full=h.length===3?h.split('').map(c=>c+c).join(''):h;
  const r=parseInt(full.slice(0,2),16)/255,g=parseInt(full.slice(2,4),16)/255,b=parseInt(full.slice(4,6),16)/255;
  const max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;
  let hue=0;
  if(d){if(max===r)hue=60*(((g-b)/d)%6);else if(max===g)hue=60*((b-r)/d+2);else hue=60*((r-g)/d+4)}
  if(hue<0)hue+=360;
  return {h:hue,s:max===0?0:d/max,v:max};
}
function hsvToHex(h,s,v){
  const c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c;
  let r=0,g=0,b=0;
  if(h<60){r=c;g=x}else if(h<120){r=x;g=c}else if(h<180){g=c;b=x}
  else if(h<240){g=x;b=c}else if(h<300){r=x;b=c}else{r=c;b=x}
  return '#'+[r+m,g+m,b+m].map(n=>Math.round(n*255).toString(16).padStart(2,'0')).join('');
}
function pickerMarkup(id,hex){
  const hsv=hexToHsv(hex);
  return `<div class="custom-picker" data-picker="${id}" data-h="${hsv.h}" data-s="${hsv.s}" data-v="${hsv.v}">
    <div class="picker-sv" style="--picker-hue:${hsv.h}">
      <span class="picker-cursor" style="left:${hsv.s*100}%;top:${(1-hsv.v)*100}%"></span>
    </div>
    <input class="picker-hue" type="range" min="0" max="360" value="${hsv.h}">
    <div class="picker-values">
      <input class="picker-hex" value="${hex}">
      <input class="picker-swatch" type="color" value="${hex}">
    </div>
  </div>`;
}
function bindCustomPicker(id,onChange){
  const root=document.querySelector(`[data-picker="${id}"]`); if(!root)return;
  const sv=root.querySelector('.picker-sv'),cursor=root.querySelector('.picker-cursor'),
        hue=root.querySelector('.picker-hue'),hex=root.querySelector('.picker-hex'),
        swatch=root.querySelector('.picker-swatch');
  let dragging=false;
  const emit=()=>{
    const h=+root.dataset.h,s=+root.dataset.s,v=+root.dataset.v,val=hsvToHex(h,s,v);
    hex.value=val;swatch.value=val;sv.style.setProperty('--picker-hue',h);
    cursor.style.left=(s*100)+'%';cursor.style.top=((1-v)*100)+'%';onChange(val);
  };
  const updateSV=e=>{
    const r=sv.getBoundingClientRect();
    const x=Math.max(0,Math.min(r.width,e.clientX-r.left));
    const y=Math.max(0,Math.min(r.height,e.clientY-r.top));
    root.dataset.s=x/r.width;root.dataset.v=1-y/r.height;emit();
  };
  sv.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();dragging=true;try{sv.setPointerCapture(e.pointerId)}catch{}updateSV(e)});
  sv.addEventListener('pointermove',e=>{if(dragging){e.preventDefault();e.stopPropagation();updateSV(e)}});
  sv.addEventListener('pointerup',e=>{e.stopPropagation();dragging=false});
  sv.addEventListener('pointercancel',()=>dragging=false);
  hue.oninput=e=>{root.dataset.h=e.target.value;emit()};
  hex.onchange=e=>{
    const hsv=hexToHsv(e.target.value);root.dataset.h=hsv.h;root.dataset.s=hsv.s;root.dataset.v=hsv.v;
    hue.value=hsv.h;emit()
  };
  swatch.oninput=e=>{
    const hsv=hexToHsv(e.target.value);root.dataset.h=hsv.h;root.dataset.s=hsv.s;root.dataset.v=hsv.v;
    hue.value=hsv.h;emit()
  };
}

function normalizeBadgeNodes(){
  state.elements.filter(e=>e.type==='badge').forEach(e=>{
    const node=document.querySelector(`.item[data-id="${e.id}"]`);
    if(!node)return;
    let box=node.querySelector('.badge-box') || node.querySelector('.badge') || node.firstElementChild;
    if(!box)return;
    box.classList.add('badge-box');
    box.style.background=e.background||'#fff';
    box.style.color=e.color||'#111';
    box.style.borderRadius=(e.radius||0)+'px';
    box.style.textAlign=e.align||'center';

    if(!box.querySelector('.badge-main')){
      const currentText=[...box.childNodes].find(n=>n.nodeType===3 && n.textContent.trim());
      const main=document.createElement('span');
      main.className='badge-main';
      main.textContent=e.text||'Badge';
      if(currentText)currentText.remove();
      box.insertBefore(main,box.firstChild);
    }
    if(!box.querySelector('.badge-sub')){
      const sub=document.createElement('small');
      sub.className='badge-sub';
      sub.textContent=e.subtext||'';
      box.appendChild(sub);
    }
    box.querySelector('.badge-main').textContent=e.text||'Badge';
    box.querySelector('.badge-main').style.fontSize=(e.badgeFontSize||24)+'px';
    box.querySelector('.badge-sub').textContent=e.subtext||'';
    box.querySelector('.badge-sub').style.fontSize=(e.badgeSubFontSize||10)+'px';
    box.querySelector('.badge-main').style.display='block';
    box.querySelector('.badge-sub').style.display='block';
  });
}

function showGuidesFor(e){

 let sx=null,sy=null;

 centersX.forEach(x=>{if(Math.abs(ecx-x)<tol){l.x=x-l.w/2;sx=x}});
 centersY.forEach(y=>{if(Math.abs(ecy-y)<tol){l.y=y-l.h/2;sy=y}});

 });

document.addEventListener('pointerdown',e=>{

  if(!part)return;
  const item=part.closest('.item');
  const z=state.elements.find(x=>x.id===item?.dataset.id);
  if(!z||z.locked)return;
  ensureBadgeParts(z);
  selectElementId(z.id);
  const rect=item.querySelector('.badge-box').getBoundingClientRect();
  badgePartDrag={z,part:part.dataset.badgePart,rect,pointerId:e.pointerId};
  part.classList.add('dragging');
  try{part.setPointerCapture(e.pointerId)}catch{}
  e.preventDefault();e.stopImmediatePropagation();
},true);

document.addEventListener('pointermove',e=>{
  if(!badgePartDrag)return;
  const {z,part,rect}=badgePartDrag;
  const px=Math.max(0,Math.min(100,((e.clientX-rect.left)/rect.width)*100));
  const py=Math.max(0,Math.min(100,((e.clientY-rect.top)/rect.height)*100));
  z.badgeParts[device][part]={x:px,y:py};
  const node=document.querySelector(`.item[data-id="${z.id}"] [data-badge-part="${part}"]`);
  if(node){node.style.left=px+'%';node.style.top=py+'%'}

  e.preventDefault();e.stopImmediatePropagation();
},true);

document.addEventListener('pointerup',e=>{

},true);

function groupBounds(groupId){

  const x=Math.min(...boxes.map(b=>b.x));

  const r=Math.max(...boxes.map(b=>b.x+b.w));

function renderGroupEditFrame(){
  document.querySelectorAll('.group-edit-frame').forEach(n=>n.remove());
  const bar=$('#groupEditBar');
  if(!bar)return;
  bar.classList.toggle('active',!!activeGroupId);
  if(!activeGroupId)return;

  const bounds=groupBounds(activeGroupId);
  const canvas=$('#canvas');
  if(!bounds||!canvas)return;

  const frame=document.createElement('div');
  frame.className='group-edit-frame';
  frame.style.left=bounds.x+'px';
  frame.style.top=bounds.y+'px';
  frame.style.width=bounds.w+'px';
  frame.style.height=bounds.h+'px';
  frame.innerHTML='<div class="group-edit-label">Badge — modification interne</div>';
  canvas.appendChild(frame);

  state.elements.forEach(e=>{
    const node=document.querySelector(`.item[data-id="${e.id}"]`);
    if(!node)return;
    node.classList.toggle('group-member-selected',e.groupId===activeGroupId && e.id===selected);
    node.classList.toggle('group-locked-selection',e.groupId===activeGroupId && e.id!==selected);
  });

const renderBeforeEditableGroups=render;
render=function(){
  renderBeforeEditableGroups();
  renderGroupEditFrame();
};

document.addEventListener('dblclick',e=>{
  const item=e.target.closest('.item');
  if(!item)return;
  const z=state.elements.find(x=>x.id===item.dataset.id);
  if(!z?.groupId)return;

  if(activeGroupId===z.groupId){
    if(z.type==='text'){
      const textNode=item.querySelector('.item-text');
      if(textNode){
        textNode.contentEditable='true';
        textNode.focus();
        const range=document.createRange();
        range.selectNodeContents(textNode);
        const sel=window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        textNode.onblur=()=>{
          z.text=textNode.textContent;
          textNode.contentEditable='false';
          scheduleAutoSave();
          renderProps();
        };
      }
    }
  }else{
    enterGroup(z.groupId);
  }
  e.preventDefault();
  e.stopImmediatePropagation();
},true);

document.addEventListener('pointerdown',e=>{
  const item=e.target.closest('.item');
  if(!item){
    if(activeGroupId && !e.target.closest('#props') && !e.target.closest('.topbar') && !e.target.closest('.side')){
      exitGroup();
    }
    return;
  }

  const z=state.elements.find(x=>x.id===item.dataset.id);
  if(!z?.groupId)return;

  if(!activeGroupId){
    const members=state.elements.filter(x=>x.groupId===z.groupId);
    selectedIds=members.map(x=>x.id);
    selected=z.id;
  }else if(activeGroupId===z.groupId){
    selected=z.id;
    selectedIds=[z.id];

    temporarilyUngrouped={element:z,groupId:z.groupId};
    delete z.groupId;
    requestAnimationFrame(()=>renderProps());
  }else{
    exitGroup();
  }
},true);

window.addEventListener('pointerup',()=>{
  if(temporarilyUngrouped){
    temporarilyUngrouped.element.groupId=temporarilyUngrouped.groupId;
    temporarilyUngrouped=null;
    scheduleAutoSave();
    renderGroupEditFrame();
  }
},true);

$('#exitGroupEdit').onclick=exitGroup;

const originalUngroupEditable=ungroupElements;
ungroupElements=function(){
  if(activeGroupId){
    snap();
    state.elements.filter(e=>e.groupId===activeGroupId).forEach(e=>{
      delete e.groupId;
      delete e.groupType;
    });
    activeGroupId=null;
    selectedIds=selected?[selected]:[];

const PROPERTY_REGISTRY = {
  shape:['transform','fill','stroke','corners','effects','visibility'],
  circle:['transform','fill','stroke','effects','visibility'],
  text:['transform','typography','fill','stroke','effects','visibility'],
  button:['transform','content','fill','stroke','corners','effects','interaction','visibility'],
  image:['transform','source','crop','stroke','corners','effects','visibility'],
  video:['transform','source','playback','stroke','corners','effects','visibility'],
  group:['transform','layout','effects','visibility']
};

function ensureVisualProps(e){
  if(!e.fill)e.fill={
    enabled:e.background!=='transparent',
    type:'solid',
    color:(e.background && e.background.startsWith('#'))?e.background:'#7557f7',
    color2:'#ff6d81',
    angle:135,
    opacity:1
  };
  if(!e.stroke)e.stroke={
    enabled:false,color:'#171827',width:2,style:'solid',
    position:'inside',dash:10,gap:6
  };
  if(!e.corners)e.corners={
    linked:true,tl:e.radius||0,tr:e.radius||0,br:e.radius||0,bl:e.radius||0
  };
  if(!e.effects)e.effects={
    shadowEnabled:false,shadowX:0,shadowY:12,shadowBlur:28,
    shadowSpread:0,shadowColor:'#000000',shadowOpacity:.22,
    innerShadow:false,blur:0
  };
  if(e.flipX===undefined)e.flipX=false;
  if(e.flipY===undefined)e.flipY=false;
}

function hexAlpha(hex,opacity){
  if(!hex || !hex.startsWith('#'))return hex;
  let h=hex.slice(1);
  if(h.length===3)h=h.split('').map(x=>x+x).join('');
  const a=Math.round(Math.max(0,Math.min(1,opacity))*255).toString(16).padStart(2,'0');
  return '#'+h+a;
}
function fillCss(e){
  ensureVisualProps(e);
  if(!e.fill.enabled)return 'transparent';
  if(e.fill.type==='gradient'){
    return `linear-gradient(${e.fill.angle||0}deg,${hexAlpha(e.fill.color,e.fill.opacity)},${hexAlpha(e.fill.color2,e.fill.opacity)})`;
  }
  return hexAlpha(e.fill.color,e.fill.opacity);
}
function strokeCss(e){
  ensureVisualProps(e);
  if(!e.stroke.enabled || !e.stroke.width)return 'none';
  const style=e.stroke.style==='dashed'?'dashed':e.stroke.style==='dotted'?'dotted':'solid';
  return `${e.stroke.width}px ${style} ${e.stroke.color}`;
}
function radiusCss(e){
  ensureVisualProps(e);
  if(e.type==='circle')return '50%';
  const c=e.corners;
  return `${c.tl}px ${c.tr}px ${c.br}px ${c.bl}px`;
}
function shadowCss(e){
  ensureVisualProps(e);
  const fx=e.effects;
  const shadows=[];
  if(fx.shadowEnabled){
    shadows.push(`${fx.shadowX}px ${fx.shadowY}px ${fx.shadowBlur}px ${fx.shadowSpread}px ${hexAlpha(fx.shadowColor,fx.shadowOpacity)}`);
  }
  if(fx.innerShadow){
    shadows.push(`inset 0 4px 14px ${hexAlpha(fx.shadowColor,Math.min(.45,fx.shadowOpacity))}`);
  }
  return shadows.length?shadows.join(','):'none';
}
function applyVisualNode(e,node){
  ensureVisualProps(e);
  node.style.background=fillCss(e);
  node.style.border=strokeCss(e);
  node.style.borderRadius=radiusCss(e);
  node.style.boxShadow=shadowCss(e);
  node.style.filter=(e.effects.blur||0)>0?`blur(${e.effects.blur}px)`:'none';
  node.style.transform=`scaleX(${e.flipX?-1:1}) scaleY(${e.flipY?-1:1})`;
  node.style.boxSizing='border-box';
  if(e.stroke.enabled && e.stroke.style==='custom-dash'){
    node.style.border='none';
    node.style.outline=`${e.stroke.width}px dashed ${e.stroke.color}`;
    node.style.outlineOffset=e.stroke.position==='outside'?(e.stroke.width/2)+'px':e.stroke.position==='inside'?(-e.stroke.width)+'px':'0px';
  }else{
    node.style.outline='none';
  }
}
function refreshSelectedVisual(){
  const e=el();if(!e)return;
  const node=document.querySelector(`.item[data-id="${e.id}"] .shape-node`) ||
             document.querySelector(`.item[data-id="${e.id}"] > div`);
  if(node)applyVisualNode(e,node);
  const item=document.querySelector(`.item[data-id="${e.id}"]`);
  if(item)item.style.opacity=e.opacity;
  scheduleAutoSave?.();
}

const renderBeforePropertyEngine=render;
render=function(){
  state.elements.forEach(ensureVisualProps);
  renderBeforePropertyEngine();
  state.elements.forEach(e=>{
    if(!['shape','circle'].includes(e.type))return;
    const item=document.querySelector(`.item[data-id="${e.id}"]`);
    if(!item)return;
    let node=item.querySelector('.shape-node');
    if(!node){
      node=[...item.children].find(n=>!n.classList.contains('handle')&&!n.classList.contains('selection-bar')&&!n.classList.contains('type-tag')&&!n.classList.contains('group-tag'));
      if(node)node.classList.add('shape-node');
    }
    if(node)applyVisualNode(e,node);
  });
};

function bindShapeInspector(e,l){
  const live=(id,event,fn,rerender=false)=>{
    const n=$('#'+id);if(!n)return;
    n.addEventListener(event,x=>{fn(x.target);refreshSelectedVisual();if(rerender)renderProps()});
  };
  ['X','Y','W','H'].forEach(k=>live('pe'+k,'input',n=>{l[k.toLowerCase()]=+n.value}));
  live('peRot','input',n=>{e.rotation=+n.value;const item=document.querySelector(`.item[data-id="${e.id}"]`);if(item)item.style.transform=`rotate(${e.rotation}deg)`});
  live('peOpacity','input',n=>e.opacity=+n.value/100);
  live('peFlipX','click',()=>{e.flipX=!e.flipX},true);
  live('peFlipY','click',()=>{e.flipY=!e.flipY},true);

  live('peFillEnabled','change',n=>e.fill.enabled=n.checked,true);
  $$('[data-fill-type]').forEach(n=>n.onclick=()=>{
    e.fill.enabled=n.dataset.fillType!=='none';
    if(n.dataset.fillType!=='none')e.fill.type=n.dataset.fillType;
    refreshSelectedVisual();renderProps();
  });
  live('peFill1','input',n=>e.fill.color=n.value);
  live('peFill2','input',n=>e.fill.color2=n.value);
  live('peFillAngle','input',n=>e.fill.angle=+n.value);
  live('peFillOpacity','input',n=>e.fill.opacity=+n.value/100);

  live('peStrokeEnabled','change',n=>e.stroke.enabled=n.checked,true);
  live('peStrokeColor','input',n=>e.stroke.color=n.value);
  live('peStrokeWidth','input',n=>e.stroke.width=+n.value);
  live('peStrokeStyle','change',n=>e.stroke.style=n.value,true);
  live('peStrokePos','change',n=>e.stroke.position=n.value);
  live('peDash','input',n=>e.stroke.dash=+n.value);
  live('peGap','input',n=>e.stroke.gap=+n.value);

  live('peCornersLinked','change',n=>e.corners.linked=n.checked);
  ['TL','TR','BR','BL'].forEach(k=>live('pe'+k,'input',n=>{
    const key=k.toLowerCase(),v=+n.value;
    e.corners[key]=v;
    if(e.corners.linked){
      ['tl','tr','br','bl'].forEach(x=>e.corners[x]=v);
      ['peTL','peTR','peBR','peBL'].forEach(id=>{const input=$('#'+id);if(input)input.value=v});
    }
  }));

  live('peShadowEnabled','change',n=>e.effects.shadowEnabled=n.checked,true);
  live('peShadowX','input',n=>e.effects.shadowX=+n.value);
  live('peShadowY','input',n=>e.effects.shadowY=+n.value);
  live('peShadowBlur','input',n=>e.effects.shadowBlur=+n.value);
  live('peShadowSpread','input',n=>e.effects.shadowSpread=+n.value);
  live('peShadowColor','input',n=>e.effects.shadowColor=n.value);
  live('peShadowOpacity','input',n=>e.effects.shadowOpacity=+n.value/100);
  live('peInnerShadow','change',n=>e.effects.innerShadow=n.checked);
  live('peBlur','input',n=>e.effects.blur=+n.value);
  live('peHide','click',()=>{e.hidden[device]=!e.hidden[device];render()});
  live('peLock','click',()=>{e.locked=!e.locked;render()});
  stopControlPropagation?.($('#props'));
}

function ensureTextProps(e){

function ensureButtonProps(e){

    active:'default',
    default:{background:e.background||'#7557f7',color:e.color||'#ffffff',borderColor:'#7557f7'},
    hover:{background:'#6046d8',color:'#ffffff',borderColor:'#6046d8'},

const ZANDO_PROJECT_SCHEMA = {
  name:'Zando Design Editor',
  version:'1.0.0',
  editorVersion:'16',
  documentType:'zando-hero',
  breakpoints:['desktop','tablet','mobile']
};

function currentSelection(){
  if(typeof selectedElements==='function'){
    const result=selectedElements();
    if(result.length)return result;
  }
  const one=el();
  return one?[one]:[];
}
function selectionBounds(items=currentSelection()){
  if(!items.length)return null;
  const boxes=items.map(e=>({e,l:layoutOf(e)}));
  const minX=Math.min(...boxes.map(x=>x.l.x));
  const minY=Math.min(...boxes.map(x=>x.l.y));
  const maxX=Math.max(...boxes.map(x=>x.l.x+x.l.w));
  const maxY=Math.max(...boxes.map(x=>x.l.y+x.l.h));
  return {x:minX,y:minY,w:maxX-minX,h:maxY-minY,maxX,maxY};
}
function commitLayoutOperation(label,operation){
  const items=currentSelection();
  if(!items.length){toast('Sélectionnez un ou plusieurs éléments');return}
  snap();
  operation(items);
  render();
  updateProToolbar();
  toast(label);
}
function alignSelection(mode){
  commitLayoutOperation('Alignement appliqué',items=>{
    const b=selectionBounds(items);
    items.forEach(e=>{
      const l=layoutOf(e);
      if(mode==='left')l.x=b.x;
      if(mode==='center-x')l.x=b.x+(b.w-l.w)/2;
      if(mode==='right')l.x=b.maxX-l.w;
      if(mode==='top')l.y=b.y;
      if(mode==='center-y')l.y=b.y+(b.h-l.h)/2;
      if(mode==='bottom')l.y=b.maxY-l.h;
    });
  });
}
function distributeSelection(axis){
  const items=currentSelection();
  if(items.length<3){toast('Sélectionnez au moins trois éléments');return}
  commitLayoutOperation('Distribution appliquée',els=>{
    const ordered=[...els].sort((a,b)=>{
      const la=layoutOf(a),lb=layoutOf(b);
      return axis==='x'?la.x-lb.x:la.y-lb.y;
    });
    const first=layoutOf(ordered[0]);
    const last=layoutOf(ordered[ordered.length-1]);
    const totalSize=ordered.reduce((sum,e)=>sum+(axis==='x'?layoutOf(e).w:layoutOf(e).h),0);
    const start=axis==='x'?first.x:first.y;
    const end=(axis==='x'?last.x+last.w:last.y+last.h);
    const gap=(end-start-totalSize)/(ordered.length-1);
    let cursor=start;
    ordered.forEach(e=>{
      const l=layoutOf(e);
      if(axis==='x'){l.x=cursor;cursor+=l.w+gap}
      else{l.y=cursor;cursor+=l.h+gap}
    });
  });
}
function moveLayerOrder(action){
  const items=currentSelection();
  if(!items.length)return toast('Aucun élément sélectionné');
  snap();
  if(action==='front'){
    items.forEach(e=>{
      const i=state.elements.indexOf(e);
      if(i>=0){state.elements.splice(i,1);state.elements.push(e)}
    });
  }else if(action==='back'){
    [...items].reverse().forEach(e=>{
      const i=state.elements.indexOf(e);
      if(i>=0){state.elements.splice(i,1);state.elements.unshift(e)}
    });
  }else{
    items.forEach(e=>{
      const i=state.elements.indexOf(e);
      const target=action==='forward'?Math.min(state.elements.length-1,i+1):Math.max(0,i-1);
      if(i!==target){
        state.elements.splice(i,1);
        state.elements.splice(target,0,e);
      }
    });
  }
  render();updateProToolbar();toast('Ordre des calques modifié');
}
function toggleEditorGrid(){
  state.settings.grid=!state.settings.grid;
  applyEditorGrid();
  updateProToolbar();
  scheduleAutoSave?.();
}
function toggleEditorSnap(){
  state.settings.snap=!state.settings.snap;
  updateProToolbar();
  scheduleAutoSave?.();
}
function applyEditorGrid(){
  const canvas=$('#canvas')||document.querySelector('.canvas');
  if(canvas)canvas.classList.toggle('canvas-grid-active',!!state.settings.grid);
}
function nudgeSelection(dx,dy,multiplier=1){
  const items=currentSelection();
  if(!items.length)return;
  snap();
  items.forEach(e=>{
    const l=layoutOf(e);
    l.x+=dx*multiplier;l.y+=dy*multiplier;
  });
  render();updateProToolbar();
}
function duplicateSelectionAdvanced(){
  const items=currentSelection();
  if(!items.length)return;
  snap();
  const newIds=[];
  items.forEach(e=>{
    const c=clone(e);
    c.id=e.id+'_copy_'+Date.now()+'_'+Math.random().toString(36).slice(2,5);
    c.name=(e.name||e.type)+' copie';
    Object.values(c.layout||{}).forEach(l=>{l.x+=18;l.y+=18});
    if(c.groupId)c.groupId='grp_'+Date.now();
    state.elements.push(c);newIds.push(c.id);
  });
  selectedIds=newIds;selected=newIds[newIds.length-1];
  render();updateProToolbar();toast('Sélection dupliquée');
}
function deleteSelectionAdvanced(){
  const ids=currentSelection().map(e=>e.id);
  if(!ids.length)return;
  snap();
  state.elements=state.elements.filter(e=>!ids.includes(e.id));
  selectedIds=[];selected=null;
  render();updateProToolbar();toast('Sélection supprimée');
}
function exportZandoProject(){
  const payload={
    schema:ZANDO_PROJECT_SCHEMA,
    exportedAt:new Date().toISOString(),
    project:{
      background:state.background,
      settings:state.settings,
      elements:state.elements
    }
  };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='zando-hero-project-v16.json';
  a.click();URL.revokeObjectURL(a.href);
  toast('Projet Zando exporté');
}
function createProToolbar(){
  if($('#proToolbar'))return;

document.addEventListener('keydown',e=>{
  const tag=document.activeElement?.tagName?.toLowerCase();
  const editing=['input','textarea','select'].includes(tag)||document.activeElement?.isContentEditable;
  if(editing)return;
  const meta=e.ctrlKey||e.metaKey;
  if(meta && e.key.toLowerCase()==='d'){e.preventDefault();duplicateSelectionAdvanced()}
  if(meta && e.key.toLowerCase()==='s'){e.preventDefault();exportZandoProject()}
  if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();deleteSelectionAdvanced()}
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){
    e.preventDefault();
    const step=e.shiftKey?10:1;
    const map={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};
    nudgeSelection(...map[e.key],step);
  }
  if(meta && e.key==='['){e.preventDefault();moveLayerOrder(e.shiftKey?'back':'backward')}
  if(meta && e.key===']'){e.preventDefault();moveLayerOrder(e.shiftKey?'front':'forward')}
});

function detachAutoLayout(e){
  const kids=childrenOf(e);
  const fl=layoutOf(e);
  kids.forEach(k=>{
    const l=layoutOf(k);
    l.x+=fl.x;l.y+=fl.y;
    k.parentId=null;
  });
  e.autoLayout.enabled=false;
  render();toast('Auto Layout détaché');
}
function applyAutoLayout(container){
  ensureAutoLayout(container);
  if(!container.autoLayout.enabled)return;
  const kids=childrenOf(container).filter(k=>!k.hidden?.[device]);
  if(!kids.length)return;
  const a=container.autoLayout;
  const fl=layoutOf(container);
  const horizontal=a.direction==='horizontal';

  let cursor=horizontal?a.paddingLeft:a.paddingTop;
  const availableCross=(horizontal?fl.h:fl.w)-
    (horizontal?a.paddingTop+a.paddingBottom:a.paddingLeft+a.paddingRight);

  kids.forEach(k=>{
    const l=layoutOf(k);
    if(horizontal){
      l.x=cursor;
      if(a.align==='start')l.y=a.paddingTop;
      if(a.align==='center')l.y=a.paddingTop+(availableCross-l.h)/2;
      if(a.align==='end')l.y=fl.h-a.paddingBottom-l.h;
      if(a.align==='stretch'){l.y=a.paddingTop;l.h=Math.max(1,availableCross)}
      cursor+=l.w+a.gap;
    }else{
      l.y=cursor;
      if(a.align==='start')l.x=a.paddingLeft;
      if(a.align==='center')l.x=a.paddingLeft+(availableCross-l.w)/2;
      if(a.align==='end')l.x=fl.w-a.paddingRight-l.w;
      if(a.align==='stretch'){l.x=a.paddingLeft;l.w=Math.max(1,availableCross)}
      cursor+=l.h+a.gap;
    }
  });

  if(a.widthMode==='hug'){
    if(horizontal){
      const total=kids.reduce((s,k)=>s+layoutOf(k).w,0)+a.gap*(kids.length-1)+a.paddingLeft+a.paddingRight;
      fl.w=Math.max(1,total);
    }else{
      const max=Math.max(...kids.map(k=>layoutOf(k).w));
      fl.w=max+a.paddingLeft+a.paddingRight;
    }
  }
  if(a.heightMode==='hug'){
    if(horizontal){
      const max=Math.max(...kids.map(k=>layoutOf(k).h));
      fl.h=max+a.paddingTop+a.paddingBottom;
    }else{
      const total=kids.reduce((s,k)=>s+layoutOf(k).h,0)+a.gap*(kids.length-1)+a.paddingTop+a.paddingBottom;
      fl.h=Math.max(1,total);
    }
  }
}

function saveActivePageSnapshot(){
  const p=zandoPages.find(x=>x.id===activePageId);

function activatePage(id){
  if(id===activePageId)return;
  saveActivePageSnapshot();
  const p=zandoPages.find(x=>x.id===id);

  state=clone(p.state);

}
function addPage(duplicateCurrent=false){
  saveActivePageSnapshot();
  const page={
    id:'page_'+Date.now(),
    name:'Slide '+(zandoPages.length+1),
    state:duplicateCurrent?clone(state):{
      background:clone(INITIAL_ZANDO_STATE_V20.background),
      settings:clone(state.settings),
      elements:[]
    }
  };
  zandoPages.push(page);
  activePageId=page.id;
  state=clone(page.state);
  selected=null;selectedIds=[];
  history=[];future=[];
  render();
  toast('Nouvelle slide ajoutée');
}
function removePage(id){
  if(zandoPages.length===1){toast('Le projet doit contenir au moins une slide');return}
  const index=zandoPages.findIndex(x=>x.id===id);
  if(index<0)return;
  zandoPages.splice(index,1);
  if(activePageId===id){
    const next=zandoPages[Math.max(0,index-1)];
    activePageId=next.id;state=clone(next.state);
    selected=null;selectedIds=[];history=[];future=[];
  }
  render();toast('Slide supprimée');
}

function typeClassV21(e){
  if(e.type==='image'||e.type==='png')return 'tag-image';

function mergeTypeLabelIntoToolbarV21(){

  if(!e)return;
  const item=document.querySelector(`.item[data-id="${e.id}"]`);
  if(!item)return;
  const bar=item.querySelector('.selection-bar');

    chip.className='selection-type-chip '+typeClassV21(e);
    chip.textContent=elementDisplayNameV21(e);
    bar.prepend(chip);
  }
  /* Évite que la barre sorte trop loin du canvas sur les bords */
  requestAnimationFrame(()=>{
    const canvas=$('#canvas');
    if(!canvas||!bar.isConnected)return;
    const itemRect=item.getBoundingClientRect();
    const barRect=bar.getBoundingClientRect();
    const canvasRect=canvas.getBoundingClientRect();
    let offset=0;
    if(barRect.left<canvasRect.left+6)offset=(canvasRect.left+6)-barRect.left;
    if(barRect.right>canvasRect.right-6)offset=(canvasRect.right-6)-barRect.right;
    bar.style.marginLeft=offset+'px';
  });
}

/* =========================================================
   V22 — FINALISATION COMPLÈTE DE L'EXPÉRIENCE DE DESIGN
   ========================================================= */
let editorZoomV22=1;
let historyLogV22=[{label:'Projet ouvert',time:new Date().toLocaleTimeString()}];
let marqueeStateV22=null;
let userGuidesV22={vertical:[],horizontal:[]};
let rulersVisibleV22=true;

function logHistoryV22(label){
  historyLogV22.unshift({label,time:new Date().toLocaleTimeString()});
  historyLogV22=historyLogV22.slice(0,80);
  renderHistoryV22();
}
function renderHistoryV22(){
  const list=$('#historyListV22');if(!list)return;
  list.innerHTML=historyLogV22.map(x=>`<div class="history-entry-v22">${esc(x.label)}<small>${x.time}</small></div>`).join('');
}
function setZoomV22(percent){
  editorZoomV22=Math.max(.25,Math.min(2,percent/100));
  zoomLevel=editorZoomV22;            // sync old system → render() reste correct
  window.__zandoZoom=editorZoomV22;   // accessible depuis le script block 1 (drag/resize)
  const canvas=$('#canvas');
  const shell=$('#canvasShell');
  if(canvas){
    canvas.style.transformOrigin='top left';
    canvas.style.transform=`scale(${editorZoomV22})`;
  }
  if(shell){
    const d=DEV[device];
    shell.style.width=(d.w*editorZoomV22)+'px';
    shell.style.height=(d.h*editorZoomV22)+'px';
  }
  const s=$('#zoomSelectV22');if(s)s.value=String(Math.round(editorZoomV22*100));
  renderRulersV22();
}
function fitCanvasV22(){
  const canvas=$('#canvas');
  const viewport=document.querySelector('.workspace')||canvas?.parentElement;
  if(!canvas||!viewport)return;
  const previewH=(document.querySelector('.preview-head')?.offsetHeight||46);
  const bottomH=(document.querySelector('.bottom')?.offsetHeight||170)+12;
  const wsPadV=36;
  const availableW=Math.max(300,viewport.clientWidth-90);
  const availableH=Math.max(200,viewport.clientHeight-previewH-bottomH-wsPadV);
  const ratio=Math.min(1,availableW/canvas.offsetWidth,availableH/canvas.offsetHeight);
  setZoomV22(Math.floor(ratio*100));
}
function installZoomV22(){
  $('#zoomOutV22').onclick=()=>setZoomV22((editorZoomV22*100)-25);
  $('#zoomInV22').onclick=()=>setZoomV22((editorZoomV22*100)+25);
  $('#zoomSelectV22').onchange=e=>setZoomV22(+e.target.value);
  $('#fitV22').onclick=fitCanvasV22;
  $('#historyToggleV22').onclick=()=>$('#historyPanelV22').classList.toggle('open');
  $('#historyCloseV22').onclick=()=>$('#historyPanelV22').classList.remove('open');
  document.addEventListener('wheel',e=>{
    if(!(e.ctrlKey||e.metaKey))return;
    e.preventDefault();
    setZoomV22(editorZoomV22*100+(e.deltaY<0?10:-10));
  },{passive:false});
}
function ensureRulersV22(){
  const canvas=$('#canvas');if(!canvas||canvas.querySelector('.ruler-x'))return;
  const rx=document.createElement('div');rx.className='ruler-x';
  const ry=document.createElement('div');ry.className='ruler-y';
  canvas.append(rx,ry);
}
function renderRulersV22(){
  ensureRulersV22();
  const canvas=$('#canvas');if(!canvas)return;
  const rx=canvas.querySelector('.ruler-x'),ry=canvas.querySelector('.ruler-y');
  if(!rx||!ry)return;
  rx.style.display=ry.style.display=rulersVisibleV22?'block':'none';
  const step=50;
  rx.innerHTML='';ry.innerHTML='';
  for(let x=0;x<=canvas.offsetWidth;x+=step){
    rx.insertAdjacentHTML('beforeend',`<i class="ruler-mark" style="left:${x}px"></i><span class="ruler-label" style="left:${x}px">${x}</span>`);
  }
  for(let y=0;y<=canvas.offsetHeight;y+=step){
    ry.insertAdjacentHTML('beforeend',`<i class="ruler-mark" style="top:${y}px"></i><span class="ruler-label" style="top:${y}px">${y}</span>`);
  }
}
function canvasPointV22(ev){
  const canvas=$('#canvas'),r=canvas.getBoundingClientRect();
  return {x:(ev.clientX-r.left)/editorZoomV22,y:(ev.clientY-r.top)/editorZoomV22};
}
function rectsIntersectV22(a,b){
  return !(a.x+a.w<b.x||b.x+b.w<a.x||a.y+a.h<b.y||b.y+b.h<a.y);
}
function installMarqueeV22(){
  const canvas=$('#canvas');if(!canvas||canvas.dataset.marqueeV22)return;
  canvas.dataset.marqueeV22='1';
  let box=canvas.querySelector('.marquee-box');
  if(!box){box=document.createElement('div');box.className='marquee-box';canvas.appendChild(box)}
  canvas.addEventListener('pointerdown',ev=>{
    if(ev.button!==0||ev.target.closest('.item')||ev.target.closest('.selection-bar')||ev.target.closest('.handle'))return;
    const p=canvasPointV22(ev);
    marqueeStateV22={start:p,current:p,additive:ev.shiftKey||ev.ctrlKey||ev.metaKey};
    box.style.display='block';box.style.left=p.x+'px';box.style.top=p.y+'px';box.style.width='0';box.style.height='0';
    canvas.setPointerCapture?.(ev.pointerId);
  });
  canvas.addEventListener('pointermove',ev=>{
    if(!marqueeStateV22)return;
    const p=canvasPointV22(ev);marqueeStateV22.current=p;
    const x=Math.min(p.x,marqueeStateV22.start.x),y=Math.min(p.y,marqueeStateV22.start.y);
    const w=Math.abs(p.x-marqueeStateV22.start.x),h=Math.abs(p.y-marqueeStateV22.start.y);
    Object.assign(box.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});
  });
  canvas.addEventListener('pointerup',()=>{
    if(!marqueeStateV22)return;
    const s=marqueeStateV22.start,p=marqueeStateV22.current;
    const boxRect={x:Math.min(s.x,p.x),y:Math.min(s.y,p.y),w:Math.abs(p.x-s.x),h:Math.abs(p.y-s.y)};
    const ids=state.elements.filter(e=>rectsIntersectV22(boxRect,layoutOf(e))).map(e=>e.id);
    selectedIds=marqueeStateV22.additive?[...new Set([...selectedIds,...ids])]:ids;
    selected=selectedIds.at(-1)||null;
    marqueeStateV22=null;box.style.display='none';render();
    if(ids.length)logHistoryV22(`${ids.length} élément(s) sélectionné(s)`);
  });
}
function installDirectEditingV22(){
  const canvas=$('#canvas');if(!canvas||canvas.dataset.directEditV22)return;
  canvas.dataset.directEditV22='1';
  canvas.addEventListener('dblclick',ev=>{
    const item=ev.target.closest('.item');if(!item)return;
    const e=state.elements.find(x=>x.id===item.dataset.id);if(!e)return;
    if(e.type==='text'){
      const target=item.querySelector('.text-content')||item.firstElementChild||item;
      target.contentEditable='true';target.focus();
      document.execCommand?.('selectAll',false,null);
      target.onblur=()=>{
        e.text=target.innerText;target.contentEditable='false';
        snap();render();logHistoryV22('Texte modifié directement');
      };
    }else if(e.type==='image'||e.type==='png'){
      const url=prompt('Nouvelle URL de l’image :',e.src||e.url||'');
      if(url!==null){snap();e.src=url;e.url=url;render();logHistoryV22('Image remplacée')}
    }
  });
}
function smartSnapV22(e,l){
  if(!state.settings?.snap)return;
  const canvas=$('#canvas'),threshold=6;
  document.querySelectorAll('.smart-guide,.smart-distance-label').forEach(n=>n.remove());
  const targets=[
    {x:0,type:'v'},{x:canvas.offsetWidth/2,type:'v'},{x:canvas.offsetWidth,type:'v'},
    {y:0,type:'h'},{y:canvas.offsetHeight/2,type:'h'},{y:canvas.offsetHeight,type:'h'}
  ];
  state.elements.filter(x=>x.id!==e.id).forEach(o=>{
    const ol=layoutOf(o);
    targets.push({x:ol.x,type:'v'},{x:ol.x+ol.w/2,type:'v'},{x:ol.x+ol.w,type:'v'});
    targets.push({y:ol.y,type:'h'},{y:ol.y+ol.h/2,type:'h'},{y:ol.y+ol.h,type:'h'});
  });
  const xPoints=[{key:'left',v:l.x,apply:t=>l.x=t},{key:'center',v:l.x+l.w/2,apply:t=>l.x=t-l.w/2},{key:'right',v:l.x+l.w,apply:t=>l.x=t-l.w}];
  const yPoints=[{key:'top',v:l.y,apply:t=>l.y=t},{key:'middle',v:l.y+l.h/2,apply:t=>l.y=t-l.h/2},{key:'bottom',v:l.y+l.h,apply:t=>l.y=t-l.h}];
  for(const p of xPoints){
    const hit=targets.filter(t=>t.type==='v').find(t=>Math.abs(t.x-p.v)<=threshold);
    if(hit){p.apply(hit.x);drawGuideV22('v',hit.x);break}
  }
  for(const p of yPoints){
    const hit=targets.filter(t=>t.type==='h').find(t=>Math.abs(t.y-p.v)<=threshold);
    if(hit){p.apply(hit.y);drawGuideV22('h',hit.y);break}
  }
}
function drawGuideV22(type,pos){
  const canvas=$('#canvas');if(!canvas)return;
  const g=document.createElement('div');g.className='smart-guide '+(type==='v'?'v':'h');
  if(type==='v')g.style.left=pos+'px';else g.style.top=pos+'px';
  canvas.appendChild(g);
}
function showPixelInfoV22(){
  const e=el();if(!e)return;
  const item=document.querySelector(`.item[data-id="${e.id}"]`);if(!item)return;
  item.title=`X: ${Math.round(layoutOf(e).x)} px · Y: ${Math.round(layoutOf(e).y)} px · ${Math.round(layoutOf(e).w)} × ${Math.round(layoutOf(e).h)} px`;
}
function installEssentialShortcutsV22(){
  document.addEventListener('keydown',e=>{
    const tag=document.activeElement?.tagName?.toLowerCase();
    if(['input','textarea','select'].includes(tag)||document.activeElement?.isContentEditable)return;
    const meta=e.ctrlKey||e.metaKey;
    if(meta&&e.key==='0'){e.preventDefault();fitCanvasV22()}
    if(meta&&e.key==='1'){e.preventDefault();setZoomV22(100)}
    if(meta&&e.key.toLowerCase()==='a'){
      e.preventDefault();selectedIds=state.elements.map(x=>x.id);selected=selectedIds.at(-1)||null;render();
    }
    if(e.key.toLowerCase()==='r'&&!meta){rulersVisibleV22=!rulersVisibleV22;renderRulersV22()}
    if(e.key==='Escape'){selected=null;selectedIds=[];render()}
  });
}
function addDesignMenuV22(){
  const bar=$('#proToolbar');if(!bar||$('#rulerToggleV22'))return;
  const r=document.createElement('button');r.id='rulerToggleV22';r.textContent='Règles';r.title='Afficher/masquer les règles — R';

}
const renderBeforeFinalDesignV22=render;
render=function(){
  renderBeforeFinalDesignV22();
  renderRulersV22();
  installMarqueeV22();
  installDirectEditingV22();
  addDesignMenuV22();
  showPixelInfoV22();
};

installZoomV22();
installEssentialShortcutsV22();
renderHistoryV22();

// ── ACK Supabase (SAVE_ACK / PUBLISH_ACK depuis React) ──
window.addEventListener('message',function(ev){
  if(!ev.data)return;
  if(ev.data.type==='SAVE_ACK'){$('#saveStatus').textContent='Enregistré ✓';toast('✅ Enregistré')}
  if(ev.data.type==='PUBLISH_ACK'){toast('✅ Hero publié !')}

// ── Point d'entrée unique ──
function _initZandoEditor(){
  if(_editorReady)return;
  _editorReady=true;

  // 1. localStorage admin (écrit par React useLayoutEffect avant que l'iframe charge)
  //    Priorité max car _initZandoEditor tourne APRÈS tous les overrides localStorage.
  try{
    const adminLoad=localStorage.getItem('__zando_hero_load__');
    if(adminLoad){
      console.log('[Zando Editor] État chargé depuis localStorage admin');
      state=JSON.parse(adminLoad);
      localStorage.removeItem('__zando_hero_load__');
      _externalLoaded=true;
      // Réinitialise aussi zandoPages — sinon saveActivePageSnapshot() peut écraser state
      if(typeof zandoPages!=='undefined'){
        const pid='page-zando-'+Date.now();
        zandoPages=[{id:pid,name:'Slide 1',state:JSON.parse(JSON.stringify(state))}];
        if(typeof activePageId!=='undefined')activePageId=pid;
      }
    }
  }catch(e){console.error('[Zando Editor] localStorage read error',e);}

  // 2. ZANDO_EDITOR_LOAD reçu avant la fin du bootstrap
  if(!_externalLoaded&&_pendingState){
    const s=_pendingState;_pendingState=null;
    _applyExternalState(s);
    return;
  }

  // 3. Fallback : hero-v19 ou démo par défaut
  if(!_externalLoaded){
    const savedV5=localStorage.getItem('hero-v19');
    if(savedV5){try{state=JSON.parse(savedV5)}catch{}}
  }

  if(typeof renderSide==='function')renderSide();
  render();
  if(typeof fitCanvasV22==='function')requestAnimationFrame(()=>fitCanvasV22());

  // Signale au parent React pour le protocole READY→LOAD (backup)
  if(_ZANDO_PARENT_ORIGIN){
    window.parent.postMessage({type:'ZANDO_EDITOR_READY'},_ZANDO_PARENT_ORIGIN);
  }
}

_initZandoEditor();
